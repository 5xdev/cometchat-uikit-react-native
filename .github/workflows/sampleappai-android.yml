name: SampleAppAI - Android Build

on:
  push:
     branches: v5
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Node.js LTS
      uses: actions/setup-node@v3
      with:
        node-version: 'lts/*'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
        
    - name: Install dependencies
      working-directory: examples/SampleAppAI
      run: npm install
        
    - name: Build Android Release APK
      working-directory: examples/SampleAppAI/android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease
        
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: examples/SampleAppAI/android/app/build/outputs/apk/release/app-release.apk